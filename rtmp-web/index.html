<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0f13" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Stream Recordings</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9' fill='%23ff4d5e'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0c0f13; --panel:#14181f; --panel-2:#1a2029; --line:#252d38; --line-2:#323c4a;
  --text:#e8edf3; --muted:#8b97a7; --faint:#5d6978;
  --accent:#4d8dff; --accent-soft:rgba(77,141,255,.16);
  --live:#ff4d5e; --warn:#f2b33d; --motion:#ffd43b; --person:#ff8a65; --pet:#63e6be;
  --radius:14px; --shadow:0 18px 50px rgba(0,0,0,.45);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{
    --motion:#e39e00; --person:#e8590c; --pet:#0ca678;
    --bg:#f4f6f9; --panel:#ffffff; --panel-2:#eef1f5; --line:#e0e5ec; --line-2:#cfd6e0;
    --text:#131922; --muted:#5b6777; --faint:#8c97a5;
    --accent:#2f6fe8; --accent-soft:rgba(47,111,232,.12);
    --shadow:0 18px 50px rgba(20,30,50,.18);
    color-scheme:light;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default}
a{color:inherit}
svg{display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 24px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:16px;letter-spacing:-.01em}
.brand .dot{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--live),#ff8a4d);display:grid;place-items:center;color:#fff}
.live-pill{display:none;align-items:center;white-space:nowrap;max-width:45vw;overflow:hidden;text-overflow:ellipsis;gap:7px;padding:4px 10px 4px 8px;border-radius:999px;background:rgba(255,77,94,.14);color:var(--live);font-weight:600;font-size:12px}
.live-pill.on{display:inline-flex}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--live);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,77,94,.6)}70%{box-shadow:0 0 0 7px rgba(255,77,94,0)}100%{box-shadow:0 0 0 0 rgba(255,77,94,0)}}
.spacer{flex:1}
.updated{color:var(--faint);font-size:12px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:13px}
.icon-btn:hover:not(:disabled){border-color:var(--line-2);background:var(--panel-2)}
.icon-btn:disabled{opacity:.4}
.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- layout ---------- */
.wrap{max-width:1440px;margin:0 auto;padding:20px 24px 60px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.stat .v{font-size:22px;font-weight:650;margin-top:4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .s{color:var(--faint);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
main,aside{min-width:0}
html,body{overflow-x:clip}
aside{position:sticky;top:78px;display:flex;flex-direction:column;gap:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.box h3{margin:0 0 10px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head b{font-weight:600}
.cal-nav{display:flex;gap:4px}
.cal-nav button{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--muted)}
.cal-nav button:hover{background:var(--panel-2);color:var(--text)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal-grid .wd{font-size:11px;color:var(--faint);padding:2px 0 4px}
.cd{position:relative;aspect-ratio:1;border-radius:8px;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--faint)}
.cd.l1,.cd.l2,.cd.l3{color:var(--text);font-weight:550}
.cd.l1{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.cd.l2{background:color-mix(in srgb,var(--accent) 32%,transparent)}
.cd.l3{background:color-mix(in srgb,var(--accent) 52%,transparent)}
.cd:not(:disabled):hover{outline:1px solid var(--accent)}
.cd.today{box-shadow:inset 0 0 0 1.5px var(--line-2)}
.cd.sel{background:var(--accent);color:#fff}
.cd.has-live::after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--live)}
.cal-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--faint)}
.link{color:var(--accent);font-size:12px}
.link:hover{text-decoration:underline}

/* streams */
.streams{display:flex;flex-direction:column;gap:2px}
.stream-btn{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;text-align:left}
.stream-btn:hover{background:var(--panel-2)}
.stream-btn.on{background:var(--accent-soft);color:var(--accent)}
.stream-btn .sw{width:8px;height:8px;border-radius:3px;flex:none}
.stream-btn .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stream-btn .c{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.stream-btn .lv{width:7px;height:7px;border-radius:50%;background:var(--live)}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
.search{flex:1;min-width:200px;position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{width:100%;height:38px;padding:0 12px 0 36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit}
.search input:focus{outline:none;border-color:var(--accent)}
.seg-ctl{display:inline-flex;padding:3px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.seg-ctl button{height:30px;padding:0 12px;border-radius:7px;color:var(--muted);font-size:13px}
.seg-ctl button.on{background:var(--panel-2);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:550}
.chip button{width:20px;height:20px;border-radius:50%;display:grid;place-items:center}
.chip button:hover{background:color-mix(in srgb,var(--accent) 25%,transparent)}

.notice{padding:10px 14px;border-radius:10px;background:rgba(242,179,61,.12);color:var(--warn);font-size:13px;margin-bottom:14px}

/* day groups */
.day{margin-bottom:30px}
.day-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px}
.day-head h2{margin:0;font-size:18px;letter-spacing:-.01em}
.day-head .sub{color:var(--muted);font-size:13px}
.day-sum{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}

.timeline{margin-bottom:14px}
.track{position:relative;height:30px;border-radius:9px;background:var(--panel);border:1px solid var(--line);
  background-image:repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px calc(100%/24));overflow:hidden}
.track{cursor:pointer}
.tl-seg{position:absolute;top:5px;bottom:5px;min-width:4px;border-radius:4px;background:var(--accent);opacity:.9;transition:transform .12s,opacity .12s}
.tl-seg:hover{opacity:1;transform:scaleY(1.2)}
.tl-seg.recording{background:var(--live);animation:blink 1.6s infinite}
.tl-seg.flv{background:var(--warn)}
.tl-mo{position:absolute;bottom:1px;height:3px;min-width:3px;border-radius:2px;background:var(--motion);pointer-events:none}
.mo-tag{color:var(--motion) !important;background:color-mix(in srgb,var(--motion) 14%,transparent) !important;font-weight:600}
.mo-sum{color:var(--motion);font-weight:600}
.tl-mo.person,.scrub-segs .mo.person{background:var(--person)}
.tl-mo.pet,.scrub-segs .mo.pet{background:var(--pet)}
.mo-tag.person,.mo-sum.person{color:var(--person) !important;background:color-mix(in srgb,var(--person) 14%,transparent) !important}
.mo-tag.pet,.mo-sum.pet{color:var(--pet) !important;background:color-mix(in srgb,var(--pet) 14%,transparent) !important}
.mo-sum.person,.mo-sum.pet{background:none !important}
/* People row: everyone seen, grouped by appearance (people.py) */
.people{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px;scrollbar-width:thin}
.people:empty{display:none}
.people .who{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;padding:0;background:none;color:var(--muted);font-size:11.5px}
.people .who i{position:relative;width:56px;height:56px;border-radius:50%;background:var(--panel-2);border:2px solid transparent;display:block}
.people .who img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:center 12%;display:block} /* head and shoulders */
.people .who b{position:absolute;right:-2px;bottom:-2px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--panel);color:var(--text);font-size:10.5px;font-weight:650;line-height:18px;font-style:normal}
.people .who span{max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.people .who:hover i{border-color:var(--line)}
.people .who.on i{border-color:var(--person)}
.people .who.on span{color:var(--person);font-weight:650}
.people .more{flex:none;align-self:flex-start;height:56px;padding:0 12px;border-radius:28px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:12px}
.people.picking .who[disabled]{opacity:.28;cursor:default}
.people.picking .who:not([disabled]) i{border-color:var(--line-2);border-style:dashed}
.people.picking .who.on i{border-style:solid}
.people.picking .who.sel i{border:2px solid var(--person)}
.people.picking .who.sel i::after{content:"✓";position:absolute;left:-3px;top:-3px;width:18px;height:18px;border-radius:50%;background:var(--person);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center}
/* bar under the People row for the picked person: "Same person as…" */
.who-bar{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;margin:0 0 12px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:13px;color:var(--muted)}
.who-bar[hidden]{display:none}
.who-bar b{color:var(--text);font-weight:650}
.who-bar img{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:center 12%;background:var(--panel-2);flex:none}
.who-bar .pair{display:flex;align-items:center;gap:4px}
.who-bar .sp{flex:1 1 200px;min-width:0}
.who-bar button{height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font-size:12.5px;font-weight:550;white-space:nowrap}
.who-bar button.primary{background:var(--person);border-color:var(--person);color:#fff}
.who-bar button:disabled{opacity:.5;cursor:default}
.who-bar input{flex:1;min-width:120px;height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line-2);background:var(--bg);color:var(--text);font:inherit;font-size:13px}
.people .ph-title{flex:none;align-self:center;writing-mode:vertical-rl;transform:rotate(180deg);color:var(--faint);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
#objF button[data-v="motion"].on{color:var(--motion)}
#objF button[data-v="person"].on{color:var(--person)}
#objF button[data-v="pet"].on{color:var(--pet)}
/* event bar under the time bar: big previous / next, what to jump between, where we are */
.evbar{--k:#ffd43b;display:flex;align-items:center;gap:10px;margin-top:10px}
.evbar.person{--k:var(--person)} .evbar.pet{--k:var(--pet)}
.evbar[hidden]{display:none}
.evbtn{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;min-width:48px;padding:0 16px;border-radius:12px;background:color-mix(in srgb,var(--k) 16%,transparent);color:var(--k);font-size:14px;font-weight:650}
.evbtn:hover{background:color-mix(in srgb,var(--k) 28%,transparent)}
.evbtn:active{transform:scale(.97)}
.evmid{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.evkinds{display:inline-flex;padding:3px;gap:2px;border-radius:11px;background:rgba(255,255,255,.06)}
.evkinds button{height:32px;padding:0 12px;border-radius:8px;color:#8b97a7;font-size:12.5px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.evkinds button:hover{color:#dfe5ec}
.evkinds button b{font-weight:700;margin-left:4px}
.evkinds button.on{background:rgba(255,255,255,.1);color:var(--c)}
.evkinds [data-k=motion]{--c:#ffd43b} .evkinds [data-k=person]{--c:var(--person)} .evkinds [data-k=pet]{--c:var(--pet)}
.evpos{color:#8b97a7;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.evpos b{color:#fff;font-weight:650}
#motionOnly[aria-pressed="true"]{background:color-mix(in srgb,var(--motion) 16%,transparent);border-color:var(--motion);color:var(--motion)}
@keyframes blink{50%{opacity:.55}}
.now-line{position:absolute;top:0;bottom:0;width:2px;background:var(--live);opacity:.7}
.ticks{position:relative;height:16px;margin-top:3px}
.ticks span{position:absolute;transform:translateX(-50%);font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.ticks span:first-child{transform:none}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{display:flex;flex-direction:column;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:transform .15s,border-color .15s,box-shadow .15s}
@media (hover:hover){.card:hover{transform:translateY(-2px);border-color:var(--line-2);box-shadow:var(--shadow)}}
.card:active{transform:scale(.985)}
.thumb{position:relative;aspect-ratio:16/9;background:var(--panel-2);overflow:hidden}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint)}
.thumb .dur{position:absolute;right:8px;bottom:8px;padding:2px 7px;border-radius:6px;background:rgba(0,0,0,.72);color:#fff;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.thumb .badge{position:absolute;left:8px;top:8px;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.03em;color:#fff}
.badge.live{background:var(--live)}
.badge.warn{background:var(--warn);color:#1a1300}
.thumb .play{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .15s;background:rgba(0,0,0,.25)}
.thumb .play i{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.95);color:#111;display:grid;place-items:center}
@media (hover:hover){.card:hover .play{opacity:1}}
.card .body{padding:11px 13px 13px}
.card .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .when{color:var(--muted);font-size:13px;margin-top:1px;font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.tags span{font-size:11.5px;padding:2px 7px;border-radius:6px;background:var(--panel-2);color:var(--muted);font-variant-numeric:tabular-nums}

.empty{padding:70px 20px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line-2);border-radius:var(--radius)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
.skeleton{height:220px;border-radius:var(--radius);background:linear-gradient(90deg,var(--panel) 0%,var(--panel-2) 50%,var(--panel) 100%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- player modal ---------- */
.modal{position:fixed;inset:0;z-index:50;display:none;background:#000}
.modal.open{display:block}
.mcard{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow-y:auto;background:var(--panel)}
.stage{position:relative;flex:none;background:#000;display:flex;flex-direction:column;min-width:0}
#freeze{position:absolute;object-fit:contain;background:#000;pointer-events:none} /* last frame while the next file loads */
.vwrap{position:relative;width:100%;min-width:0}
#hdVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000} /* HD, over the (empty) SD video */
/* zoom (double-tap): the videos are scaled inside the frame */
.vwrap{overflow:hidden}
.vwrap video{transform-origin:0 0;touch-action:pan-y}
.vwrap.zoomed video{touch-action:none;cursor:grab}
.zoom-pill{position:absolute;left:10px;bottom:10px;padding:6px 11px;border-radius:7px;border:0;background:rgba(0,0,0,.6);
  backdrop-filter:blur(4px);color:#fff;font:600 12px/1 inherit;cursor:pointer}
.zoom-pill[hidden]{display:none}
/* live sound on / off: a round speaker button like the browser's own (the live picture has no sound track of its own, so the video's volume button can't be used) */
.sound-pill{position:absolute;right:10px;bottom:56px;width:40px;height:40px;display:grid;place-items:center;padding:0;border-radius:50%;border:0;background:rgba(0,0,0,.55);
  backdrop-filter:blur(4px);color:#fff;cursor:pointer}
.sound-pill svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sound-pill.tap{animation:soundtap 1.4s ease-in-out infinite}
@keyframes soundtap{50%{box-shadow:0 0 0 6px rgba(255,255,255,.22)}}
@media (prefers-reduced-motion:reduce){.sound-pill.tap{animation:none}}
.sound-pill[hidden]{display:none}
.vbtn.hd{width:auto;padding:0 9px;font:700 12px/1 inherit;letter-spacing:.03em;border:1.5px solid currentColor;height:26px;border-radius:7px;align-self:center}
.vbtn.hd{background:var(--accent);border-color:var(--accent);color:#fff;cursor:default} /* a tag: this camera plays in HD */
.vwrap:fullscreen{display:flex;align-items:center;background:#000}
.vwrap:fullscreen video{max-height:100vh;height:100%}
/* on the picture while watching live (top right: the cameras put their clock top left) */
.live-badge{position:absolute;top:10px;right:10px;display:flex;align-items:center;gap:7px;padding:5px 10px 5px 9px;border-radius:7px;
  background:rgba(0,0,0,.55);backdrop-filter:blur(4px);color:#fff;font-size:12px;letter-spacing:.04em;pointer-events:none}
.live-badge b{color:#ff6b78;font-weight:750}
.live-badge span{color:#dfe5ec;font-weight:550;letter-spacing:0}
.live-badge span:empty{display:none}
.live-badge[hidden]{display:none}
.vwrap{display:flex;justify-content:center}
/* as big as fits with the bar, time bar and dock on screen (never below 45% of it) */
.stage video{width:100%;max-height:max(45vh,calc(100vh - 290px));max-height:max(45dvh,calc(100dvh - 290px));aspect-ratio:16/9;background:#000;display:block}
.scrub{width:100%;max-width:1600px;margin:0 auto}
.nope{padding:40px;text-align:center;color:#c9d1db;max-width:420px;margin:auto}
/* player time bar (always on the black stage, so fixed light-on-dark colours) */
.scrub{flex:none;padding:10px 16px 12px;color:#8b97a7;user-select:none;-webkit-user-select:none}
.scrub-head{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.scrub-head b{color:#fff;font-weight:600;font-size:13px}
.scrub-head .gap{color:#f2b33d}
.scrub-head span:last-child{overflow:hidden;text-overflow:ellipsis}
.scrub-track{position:relative;height:36px;border-radius:8px;background-color:#11151b;cursor:pointer;touch-action:none}
.scrub-segs{position:absolute;inset:0;overflow:hidden;border-radius:8px}
.scrub-segs .sg{position:absolute;top:8px;bottom:8px;min-width:3px;border-radius:4px;background:var(--accent);opacity:.5;box-shadow:0 0 0 1px #11151b}
.scrub-segs .sg.cur{opacity:1}
.scrub-segs .sg.recording{background:var(--live)}
.scrub-segs .sg.flv,.scrub-segs .sg.processing{background:var(--warn)}
.scrub-segs .car{position:absolute;top:2px;height:4px;border-radius:2px;pointer-events:none;background:#37b24d}
.scrub-segs .car.off{background:rgba(255,107,107,.45)}
.scrub-segs.hdmode .sg{display:none} /* HD cameras: the bar shows where there's HD instead */
.hd-none{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:24px;text-align:center;color:#c9d1db;font-size:13px;line-height:1.45;pointer-events:none}
.hd-none b{color:#fff;font-size:15px}
.hd-none[hidden]{display:none}
.scrub-segs .hd{position:absolute;top:8px;bottom:8px;min-width:2px;background:var(--accent);box-shadow:inset 1px 0 0 rgba(0,0,0,.45);pointer-events:none} /* one per file: a thin line where one starts */
.scrub-segs .hd.rec{background:var(--live)} /* still being recorded */
.scrub-segs .mo{position:absolute;bottom:2px;height:4px;min-width:3px;border-radius:2px;background:#ffd43b;pointer-events:none}
#scrubDay{flex:1;min-width:0;text-align:right}
.golive{height:22px;padding:0 8px;border-radius:6px;background:rgba(255,77,94,.2);color:#ff6b78;font-size:11.5px;font-weight:700;letter-spacing:.02em}
.golive:hover{background:rgba(255,77,94,.32)}
.scrub-ph{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:#fff;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.45);touch-action:none;cursor:ew-resize}
.scrub-ph::after{content:"";position:absolute;top:-10px;bottom:-6px;left:-14px;right:-14px} /* bigger grab area for the knob */
.scrub-scroll{overflow-x:auto;overflow-y:hidden;padding-top:8px;margin-top:-8px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.22) transparent;overscroll-behavior-x:contain}
.scrub-scroll::-webkit-scrollbar{height:4px}
.scrub-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:2px}
.scrub-inner{min-width:100%}
.scrub-scroll.zoomed .scrub-track{touch-action:pan-x} /* zoomed: swipe scrolls, tap jumps, drag the knob to scrub */
.zoom{display:inline-flex;align-items:center;gap:2px;flex:none;padding:2px;border-radius:9px;background:rgba(255,255,255,.06)}
.zoom button{height:24px;padding:0 9px;border-radius:7px;color:#8b97a7;font-size:11.5px;font-weight:650;font-variant-numeric:tabular-nums}
.zoom button:hover:not(:disabled){color:#fff}
.zoom button.on{background:rgba(255,255,255,.14);color:#fff}
.zoom button:disabled{opacity:.3;cursor:default}
.scrub-ph::before{content:"";position:absolute;top:-4px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.5);transition:transform .12s}
.scrub-track.dragging .scrub-ph::before{transform:scale(1.35)}
.scrub-ticks{position:relative;height:14px;margin-top:5px;font-size:10.5px;color:#5d6978;font-variant-numeric:tabular-nums}
.scrub-ticks span{position:absolute;transform:translateX(-50%)}
.scrub-ticks span.start{transform:none}
.scrub-ticks span.end{transform:translateX(-100%)}
.nope b{display:block;color:#fff;font-size:17px;margin-bottom:6px}

/* recording view: a page of its own. Bar, picture, time bar, then speed and people */
.vbar{flex:none;display:flex;align-items:center;gap:14px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
.vback{flex:none;display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 12px 0 6px;border-radius:10px;color:var(--muted);font-size:13.5px;font-weight:600}
.vback:hover{background:var(--panel-2);color:var(--text)}
.vtitle{min-width:0;flex:0 1 auto}
.vtitle h3{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vtitle .sub{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.daynav{flex:none;display:flex;align-items:center;gap:2px;margin:0 auto;padding:3px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line)}
.daynav button{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 10px;border-radius:9px;color:var(--muted);font-size:12.5px;font-weight:600;max-width:150px}
.daynav button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.daynav button:hover:not(:disabled){background:var(--panel);color:var(--text)}
.daynav button:disabled{opacity:.35}
.daynav b{min-width:110px;padding:0 8px;text-align:center;font-size:13px;font-weight:700;white-space:nowrap}
.vacts{flex:none;display:flex;align-items:center;gap:4px}
.vbtn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;color:var(--muted);text-decoration:none}
.vbtn:hover{background:var(--panel-2);color:var(--text)}
.kbd-help{cursor:help}
.dock{flex:1 0 auto;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px 28px;align-items:start;align-content:start;padding:14px 20px 18px;padding-bottom:max(18px,env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}

.dock-sec{min-width:0}
.dock-sec[hidden],.sec[hidden]{display:none}
.dock .lbl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.dock .lbl .count{text-transform:none;letter-spacing:0}
.dock .lbl .hint{margin-left:6px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--faint)}
.speeds{display:inline-flex;padding:3px;gap:2px;border-radius:11px;background:var(--panel-2);border:1px solid var(--line)}
.speeds button{height:30px;min-width:40px;padding:0 8px;border-radius:8px;color:var(--muted);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.speeds button:hover{color:var(--text)}
.speeds button.on{background:var(--accent);color:#fff}
.dock .people{margin:0;padding-bottom:4px}
.dock .who-bar{grid-column:1/-1;margin:0}
#peopleSec:has(.people:empty){display:none}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;z-index:60;padding:10px 16px;border-radius:10px;background:var(--text);color:var(--bg);font-size:13px;font-weight:550;transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- responsive ---------- */
@media (max-width:1000px){
  .layout{grid-template-columns:minmax(0,1fr)}
  aside{position:static;display:grid;grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
  .top{padding:10px 16px}
  .wrap{padding:16px 16px 40px}
  .updated{display:none}
  .brand{font-size:15px}
  #refresh span{display:none}
  .stats{grid-template-columns:1fr 1fr}
  aside{grid-template-columns:1fr}
  .ticks .minor{display:none}
  .modal{padding:0}
  .mcard{border-radius:0;height:100%;border:0}
  .day-head{flex-direction:column;align-items:flex-start;gap:2px}
}

/* ---------- mobile ---------- */
.tb-row{display:flex;align-items:center;gap:10px}
.m-only{display:none !important}
.m-streams{gap:6px;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.m-streams::-webkit-scrollbar,.tb-row::-webkit-scrollbar,.stats::-webkit-scrollbar{display:none}
.m-streams button{flex:none;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px;white-space:nowrap}
.m-streams button .sw{width:8px;height:8px;border-radius:3px}
.m-streams button .c{color:var(--faint);font-size:12px}
.m-streams button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.m-streams button.on .c{color:rgba(255,255,255,.8)}
.m-streams button .lv{width:7px;height:7px;border-radius:50%;background:var(--live)}

@media (max-width:640px){
  body{font-size:14.5px}
  .m-only{display:flex !important}
  .top{padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
  .wrap{padding:14px 16px calc(40px + env(safe-area-inset-bottom))}

  /* stats: swipeable row */
  .stats{display:flex;overflow-x:auto;gap:10px;margin:0 -16px 16px;padding:0 16px;scroll-snap-type:x mandatory;scroll-padding-inline:16px;scrollbar-width:none}
  .stat{flex:0 0 44%;scroll-snap-align:start;padding:11px 13px}
  .stat .k{font-size:11px}
  .stat .v{font-size:19px}

  /* sidebar -> calendar drawer, streams -> chip row */
  aside{display:none;position:static;margin-bottom:14px}
  body.cal-open aside{display:block}
  aside .box + .box{display:none}
  .cd{font-size:14px;aspect-ratio:auto;height:40px}

  /* toolbar */
  .toolbar{gap:8px;margin-bottom:10px}
  .search{flex:1 1 100%;min-width:0}
  .search input{height:44px;font-size:16px;border-radius:12px}
  .tb-row{flex:1 1 100%;overflow-x:auto;margin:0 -16px;padding:2px 16px;scrollbar-width:none}
  .tb-row > *{flex:none}
  .tb-row .icon-btn{height:38px;border-radius:10px}
  body.cal-open #calToggle{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .seg-ctl button{height:32px;padding:0 12px}
  #dayChip:empty{display:none}

  /* day groups */
  .day{margin-bottom:24px}
  .day-head h2{font-size:17px}
  .timeline{margin-bottom:12px}
  .tl-scroll{display:flex;overflow-x:auto;margin:0 -16px;padding-left:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
  .tl-scroll::-webkit-scrollbar{display:none}
  .tl-scroll::after{content:"";flex:none;width:16px}
  .tl-inner{flex:none}
  .track{height:40px;border-radius:10px}
  .tl-seg{top:6px;bottom:6px;min-width:10px;border-radius:5px;box-shadow:0 0 0 1px var(--panel)}
  .tl-seg:hover{transform:none}
  .tl-seg:active{opacity:1;transform:scaleY(1.15)}
  .ticks{height:18px;margin-top:4px}
  .ticks span{font-size:11px}
  .ticks span.end{transform:translateX(-100%)}

  /* cards -> compact list rows */
  .grid{grid-template-columns:1fr;gap:10px}
  .card{flex-direction:row;align-items:stretch;border-radius:12px}
  .thumb{width:38%;max-width:170px;flex:none;aspect-ratio:16/10}
  .thumb .dur{right:5px;bottom:5px;font-size:11px;padding:1px 6px}
  .thumb .badge{left:5px;top:5px;font-size:10px;padding:2px 6px}
  .thumb .ph svg{width:26px;height:26px}
  .card .body{flex:1;min-width:0;padding:9px 11px;display:flex;flex-direction:column;justify-content:center}
  .card .when{font-size:12.5px}
  .tags{margin-top:6px}
  .tags span{font-size:11px;padding:1px 6px}

  /* recording view on a phone: bar on one row, day buttons under it; the page scrolls */
  .vbar{flex-wrap:wrap;gap:6px 8px;padding:8px 10px}
  .vback span{display:none}
  .vback{padding:0 6px}
  .vtitle{flex:1}
  .daynav{order:3;flex:1 0 100%;justify-content:space-between}
  .daynav b{min-width:0}
  .stage video{max-height:none}
  .scrub{padding:10px 14px 12px}
  .scrub-track{height:42px}
  #scrubDay{display:none}
  .scrub-head{gap:6px}
  .zoom{margin-left:auto}
  .zoom button{padding:0 7px}
  .evbar{gap:8px}
  .evbtn{padding:0;width:52px;height:48px}
  .evbtn span{display:none}
  .evmid{flex-direction:column;gap:4px}
  .evkinds button{padding:0 9px}
  .scrub-segs .sg{top:10px;bottom:10px}
  .nope{padding:28px 20px}
  .dock{grid-template-columns:minmax(0,1fr);padding:14px 14px 18px}
  .dock .lbl .hint{display:none}
  .speeds{display:grid;grid-template-columns:repeat(8,1fr);width:100%}
  .speeds button{min-width:0;padding:0}
}
@media (hover:none){ .kbd-help{display:none} }

/* home: one tile per camera, live or offline */
.home{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));align-content:center;gap:16px;padding:16px;max-width:1600px;margin:0 auto}
.tile{position:relative;display:block;width:100%;aspect-ratio:16/9;padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#000;cursor:pointer;color:#fff;text-align:left}
.tile video,.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.tile img{opacity:.35;filter:grayscale(1)}
.tile .st{position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:8px;background:rgba(0,0,0,.6);font-size:12px;font-weight:700;letter-spacing:.04em}
.tile .st i{width:8px;height:8px;border-radius:50%;background:#8b949e}
.tile.live .st{color:#ff6b78}
.tile.live .st i{background:#ff4d5e;animation:pulse 1.6s infinite}
.tile .nm{position:absolute;left:12px;bottom:12px;padding:4px 10px;border-radius:8px;background:rgba(0,0,0,.6);font-size:15px;font-weight:650}
.tile .ago{position:absolute;right:12px;bottom:12px;padding:4px 10px;border-radius:8px;background:rgba(0,0,0,.6);font-size:12px;color:#c9d1d9}
.tile .ago:empty{display:none}
.tile .hdt{position:absolute;top:12px;right:12px;padding:5px 9px;border-radius:7px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;letter-spacing:.03em}
.tile .hdt[hidden]{display:none}
@media (hover:hover){.tile:hover{border-color:var(--line-2);box-shadow:var(--shadow)}}
.home .skeleton{grid-column:1/-1}

/* ===== camera page theme: header, day row, picture badge, unified time bar, jump section ===== */
.vbar{flex-wrap:nowrap;gap:8px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));border-bottom:0}
.vback{width:40px;height:40px;padding:0;justify-content:center;border-radius:10px}
.vback span{display:none}
.vtitle{flex:1 1 auto}
.vtitle h3{font-size:15px}
.vtitle .sub{font-size:11.5px}
.vacts{gap:6px}
.vbtn{width:40px;height:40px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line)}
.vbtn.hd{width:auto;height:28px;padding:0 10px;border:0;border-radius:8px;font-size:12px}
.live-badge{gap:7px;padding:4px 10px 4px 9px;font-weight:600;letter-spacing:0;font-variant-numeric:tabular-nums}
.live-badge .bdot{width:8px;height:8px;border-radius:50%;background:var(--live);animation:pulse 1.4s infinite}
.live-badge b{color:#fff;font-weight:650}
.live-badge.rec .bdot{border-radius:2px;background:#f2b33d;animation:none}
.live-badge.rec b{color:#f2b33d}
.live-badge span{color:#fff;font-weight:500}
.scrub{padding:12px 12px 6px}
.scrub-head{justify-content:flex-start;align-items:center;gap:8px;margin-bottom:10px}
.scrub-head b{font-size:17px;font-weight:650;color:#fff}
.golive{height:30px;padding:0 11px;border-radius:9px;background:#1a2029;border:1px solid #252d38;color:#ff6b78;font-size:12px}
.scrub-head .zoom{margin-left:auto;overflow:visible;background:#14181f}
.zoom button{height:32px;padding:0 10px;font-size:12px}
.zoom button.on{background:#252d38}
.ubar{display:grid;grid-template-columns:22px minmax(0,1fr);background:#14181f;border-radius:12px;padding:8px 10px 6px 4px}
.ugut{position:relative;height:52px;color:#5d6978}
.ugut svg{position:absolute;left:3px;width:16px;height:16px}
.ugut svg:nth-child(1){top:2px}.ugut svg:nth-child(2){top:23px}.ugut svg:nth-child(3){top:37px}
.scrub-track{height:52px;background-color:transparent;border-radius:0}
.scrub-segs{overflow:visible;border-radius:0}
.scrub-segs .sg{top:24px;bottom:auto;height:14px;border-radius:3px;min-width:2px}
.scrub-segs .hd{top:24px;bottom:auto;height:14px;border-radius:3px}
.scrub-segs .car{top:42px;height:6px;border-radius:3px}
.scrub-segs .ev{position:absolute;top:0;height:20px;transform:translateX(-50%);display:flex;align-items:center;gap:1px;pointer-events:none;white-space:nowrap}
.ev svg{width:15px;height:15px}
.ev .pe{color:var(--person)} .ev .pw{color:var(--pet)}
.ev circle[r="1.2"]{fill:currentColor}
.ev sup{margin-left:1px;font-size:10.5px;font-weight:600;line-height:1;color:#c9d1db}
.scrub-ticks{height:16px;margin-top:6px;font-size:11px;color:#8b97a7}
.carline{display:flex;align-items:center;gap:6px;margin:8px 2px 0;color:#8b97a7;font-size:12px}
.carline:empty{display:none}
.dock{display:flex;flex-direction:column;gap:12px;padding:12px 12px max(18px,env(safe-area-inset-bottom));background:var(--bg);border-top:0}
.dock>*{width:100%;max-width:1100px;margin-inline:auto}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.dock .lbl{font-size:13px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);margin-bottom:8px}
.jhead{display:flex;align-items:center;justify-content:flex-start;gap:8px;margin-bottom:8px}
.jhead:has(#moKinds:empty){display:none}
.jl{color:var(--muted);font-size:13px}
.jump:has(#moKinds:empty):has(.people:empty){display:none}
.evkinds{padding:0;gap:6px;background:none}
.evkinds button{height:34px;padding:0 12px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);font-size:13px}
.evkinds button.on{background:color-mix(in srgb,var(--c) 16%,var(--panel-2));border-color:var(--c);color:var(--c)}
.people .who{width:60px}
.people .who i{width:48px;height:48px}
.evbar{margin-top:6px;gap:10px}
.evbtn{width:52px;height:46px;padding:0;border-radius:12px}
.evpos{color:var(--muted);font-size:13px}
.evpos b{color:var(--text)}
@media (min-width:900px){.scrub-ticks{font-size:11.5px}}

/* ===== the picture: rounded, with its own buttons (play, speed, sound, full screen) ===== */
.stage{background:var(--bg-dark,#0c0f13);padding-top:10px}
.vwrap{margin:0 12px;width:auto;border-radius:10px}
.vwrap:fullscreen{margin:0;border-radius:0}
.live-badge{left:8px;right:auto;top:8px;border-radius:8px;background:rgba(0,0,0,.45)}
.vclock{position:absolute;right:8px;top:8px;padding:4px 9px;border-radius:8px;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);color:#fff;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;pointer-events:none}
.vclock[hidden]{display:none}
.vctl{position:absolute;bottom:8px;display:flex;align-items:center;gap:6px}
.vctl-l{left:8px}.vctl-r{right:8px}
.vc{display:inline-grid;place-items:center;min-width:36px;height:36px;padding:0 9px;border:0;border-radius:9px;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);color:#fff;font:600 13px/1 inherit;cursor:pointer}
.vc svg{width:20px;height:20px}
.vc[hidden]{display:none}
.vctl .sound-pill{position:static;width:auto;height:36px;border-radius:9px}
.vctl .sound-pill svg{width:20px;height:20px}
.zoom-pill{left:50%;transform:translateX(-50%)}

.vbar{position:relative}
.calpop{position:absolute;right:12px;top:calc(100% - 4px);z-index:20;width:290px;padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--line-2,var(--line));box-shadow:0 12px 32px rgba(0,0,0,.5)}
.calpop[hidden]{display:none}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:14px}
.calhead button{width:36px;height:36px;border-radius:10px;color:var(--text);font-size:20px}
.calhead button:disabled{opacity:.3}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.calgrid span{color:var(--muted);font-size:11px;padding:4px 0}
.calgrid button{height:36px;border-radius:9px;color:var(--text);font-size:13.5px;font-variant-numeric:tabular-nums}
.calgrid button:disabled{color:var(--faint);opacity:.4;cursor:default}
.calgrid button:not(:disabled):hover{background:var(--panel-2)}
.calgrid button.tod{box-shadow:inset 0 0 0 1px var(--line-2,var(--line))}
.calgrid button.sel{background:var(--accent);color:#fff}
.jhead{display:none !important}
.jump:has(.people:empty){display:none}
.vclock,.live-badge,.vctl{transition:opacity .35s}
.vwrap.idle .vclock,.vwrap.idle .vctl{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.vclock,.live-badge,.vctl{transition:none}}

/* ===== sign-in ===== */
.login{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:var(--bg,#0c0f13);padding:24px}
.login[hidden]{display:none}
.login-card{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:340px;text-align:center}

<body>

<script>
/* ===== configuration ===== */
// what each camera is called on screen (its stream name stays the key)
const CAM_NAMES = { cam1: 'Guttedar Nilaya' };
const camName = s => CAM_NAMES[s] || s;
const CFG = {
  streams:  '/recordings/streams.json', // written by recordings.py: the cameras; each has its own
                                        // <stream>/index.json, people.json and live-dvr.json
  fallback: '/api/files/',            // nginx autoindex JSON (used if index.json is missing)
  base:     '/recordings/',           // where the video files are served
  refreshMs: 60000,
  hls:      '/hls/',                  // live HLS playlists: /hls/<stream>.m3u8
  stat:     '/stat',                  // nginx-rtmp stats (who is live right now)
  statMs:   15000,
  // <stream>/live-dvr.json, written by live_dvr.py: rewindable copies of recordings in progress
  liveDvrMs: 5000,
  // <stream>/people.json, written by people.py: sightings grouped by person
  peopleMin: 2,                          // people seen fewer times are behind "+ more"
  peopleApi: '/api/people/',             // people_api.py: "same person" marks
  hlsJs:    ['/assets/hls.min.js', 'https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js'],
};

/* ===== helpers ===== */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const encPath = p => p.split('/').map(encodeURIComponent).join('/');
const fileUrl = f => CFG.base + encPath(f);

function fmtDur(s) {
  if (!s) return '—';
  s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return h ? `${h}h ${pad(m)}m` : m ? `${m}m ${pad(sec)}s` : `${sec}s`;
}
function fmtClock(s) {
  if (!s) return '—';
  s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return h ? `${h}:${pad(m)}:${pad(sec)}` : `${m}:${pad(sec)}`;
}
function fmtSize(b) {
  if (!b) return '—';
  const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return `${b.toFixed(b >= 100 || i === 0 ? 0 : 1)} ${u[i]}`;
}
const fmtTime = d => d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const fmtTimeS = d => d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
const fmtDateLong = d => d.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const fmtDateShort = d => d.toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' });
function relDay(d) {
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const diff = Math.round((t - d) / 864e5);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  if (diff > 1 && diff < 7) return d.toLocaleDateString([], { weekday: 'long' });
  return d.toLocaleDateString([], { day: 'numeric', month: 'long' });
}
function ago(d) {
  const s = (Date.now() - d) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
  const days = Math.floor(s / 86400);
  return days === 1 ? 'yesterday' : `${days} days ago`;
}
function resLabel(r) {
  const h = r.height; if (!h) return '';
  return h >= 2160 ? '4K' : h >= 1440 ? '1440p' : h >= 1080 ? '1080p' : h >= 720 ? '720p' : h >= 480 ? '480p' : `${h}p`;
}
const PALETTE = ['#4d8dff', '#35c28b', '#b57bff', '#ff8a4d', '#2ec5d3', '#f2b33d', '#ff6fa8', '#8fa0ff'];
const colorMap = new Map();
const streamColor = s => { if (!colorMap.has(s)) colorMap.set(s, PALETTE[colorMap.size % PALETTE.length]); return colorMap.get(s); };

const NAME_RE = /^(.+?)(?:-(\d{9,11}))?_(\d{4})-(\d{2})-(\d{2})_(\d{2})-(\d{2})-(\d{2})$/;
function parseName(file) {
  const stem = file.replace(/\.[^.]+$/, '');
  const m = stem.match(NAME_RE);
  if (!m) return { stream: stem, start: null };
  const start = m[2] ? +m[2] : Date.UTC(+m[3], m[4] - 1, +m[5], +m[6], +m[7], +m[8]) / 1000;
  return { stream: m[1], start };
}

const ICON = {
  play: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  film: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5v5l4-2.5z" fill="currentColor"/></svg>',
  close: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
};

/* ===== state ===== */
let RAW = [], ALL = [], visible = [], source = 'index', loadedOnce = false;
let LIVE = null; // Map(stream -> {ms}) from /stat, or null if /stat is unreachable
let DVR = null, dvrText = ''; // live-dvr.json: {dvr: {recording file: {path, start}}}
let PEOPLE = null;           // every camera's people.json, combined
let STREAMS = [];            // streams.json: the cameras
const streamUrl = (s, f) => `${CFG.base}${encodeURIComponent(s)}/${f}?t=${Date.now()}`;
// one JSON file from every camera (null where it is missing)
const perStream = f => Promise.all(STREAMS.map(s => fetch(streamUrl(s, f), { cache: 'no-store' })
  .then(r => r.ok ? r.text() : null).catch(() => null)));
let peopleAll = false;       // show people seen only once too
let pick = null;             // "Same person as…": {from: id, to: [ids]} while choosing the others
let pendingSame = [];        // marks made here that people.json doesn't include yet: [{a, b, mark, at}]
let pendingNames = {};       // names given here that people.json doesn't show yet: {id: {name, at}}
let pendingObjects = {};     // "not a person" marks people.json doesn't include yet: {id: at}
let naming = false;          // the person bar shows the rename field
const state = { q: '', stream: '', range: 'all', day: null, sort: 'desc', month: null, obj: '', who: '' }; // obj: '' | motion | person | pet; who: a person id
let currentFile = null, speed = 1;

/* ===== data ===== */
function norm(r) {
  const dur = +r.duration || 0;
  const startD = new Date(r.start * 1000);
  const status = r.status || 'ready';
  return { ...r, status, dur, startD, endD: new Date((r.start + dur) * 1000), day: dayKey(startD),
           playable: (status === 'ready' && /\.mp4$/i.test(r.file)) || status === 'recording' };
}

async function fetchLiveDvr() {
  try {
    const texts = await perStream('live-dvr.json'), text = texts.join('\n');
    if (text === dvrText) return false;
    dvrText = text;
    DVR = { dvr: {} };
    for (const t of texts) if (t) Object.assign(DVR.dvr, JSON.parse(t).dvr || {});
    return true;
  } catch { return false; }
}

async function fetchStat() {
  try {
    const r = await fetch(`${CFG.stat}?t=${Date.now()}`, { cache: 'no-store' });
    if (!r.ok) throw 0;
    const x = new DOMParser().parseFromString(await r.text(), 'text/xml');
    const kid = (el, tag) => [...el.children].find(c => c.tagName === tag);
    const m = new Map();
    for (const st of x.getElementsByTagName('stream')) {
      if (kid(st.parentElement?.parentElement || st, 'name')?.textContent === 'show') continue; // live_relay.py's copy
      const name = kid(st, 'name')?.textContent;
      if (name && st.getElementsByTagName('publishing').length) m.set(name, { ms: +(kid(st, 'time')?.textContent || 0) });
    }
    LIVE = m;
  } catch { LIVE = null; }
}

async function fetchPeople() {
  try {
    const all = (await perStream('people.json')).filter(Boolean).map(t => JSON.parse(t));
    PEOPLE = all.length ? { people: [], seen: {}, static: {}, learned: {}, marks: [] } : null;
    for (const x of all) {
      PEOPLE.people.push(...(x.people || []));
      Object.assign(PEOPLE.seen, x.seen || {});
      Object.assign(PEOPLE.static, x.static || {});
      Object.assign(PEOPLE.learned, x.learned || {});
      PEOPLE.marks.push(...(x.marks || []));
      PEOPLE.objects = [...(PEOPLE.objects || []), ...(x.objects || [])];
    }
  } catch { PEOPLE = null; }
  // until people.py has regrouped with them (a minute or two), show marks and names made
  // here as done (a people.json from a run that started before them doesn't have them)
  const now = Date.now() / 1000, stale = x => now - x.at > 900;
  pendingSame = pendingSame.filter(m => PEOPLE && !(PEOPLE.marks || []).includes(m.mark) && !stale(m));
  for (const [id, at] of Object.entries(pendingObjects)) {
    if (!PEOPLE || PEOPLE.objects?.includes(id) || stale({ at })) delete pendingObjects[id];
    else PEOPLE.people = PEOPLE.people.filter(p => p.id !== id);
  }
  merged = {};
  applyPending();
  for (const [id, n] of Object.entries(pendingNames)) {
    const p = PEOPLE?.people?.find(x => x.id === id);
    if (!p || (p.name || '') === n.name || stale(n)) delete pendingNames[id];
    else p.name = n.name || null;
  }
}

// pending marks, applied to PEOPLE; merged: id -> the id it was shown joined into
let merged = {};
function applyPending() {
  const res = id => { for (let i = 0; i < 50 && merged[id]; i++) id = merged[id]; return id; };
  for (const m of pendingSame) {
    const a = res(m.a), b = res(m.b), keep = joinLocally(a, b);
    if (keep) merged[keep === a ? b : a] = keep;
  }
  if (state.who) state.who = res(state.who);
}

// show two people as one right away (people.py does it for real on its next run)
function joinLocally(a, b) {
  const list = PEOPLE?.people || [];
  let A = list.find(p => p.id === a), B = list.find(p => p.id === b);
  if (!A || !B || A === B) return null;
  if (B.n > A.n) [A, B] = [B, A];  // the bigger one keeps its id, like people.py
  A.first = Math.min(A.first, B.first); A.last = Math.max(A.last, B.last);
  A.name ||= B.name; A.joined = [...(A.joined || []), ...(B.joined || []), 'pending'];
  PEOPLE.people = list.filter(p => p !== B);
  const evs = new Set();  // count motion events, like people.py: two sightings in one event are one
  for (const [f, rows] of Object.entries(PEOPLE.seen || {})) for (const x of rows) {
    if (x[2] === B.id) x[2] = A.id;
    if (x[2] === A.id) evs.add(f + '#' + x[0]);
  }
  A.n = evs.size;
  if (state.who === B.id) state.who = A.id;
  return A.id;
}

// which cameras have a recording in progress right now, from live-dvr.json (written per
// stream by live_dvr.py, so unlike /stat it never misses a stream on another nginx worker)
const dvrStreams = () => new Set(Object.keys(DVR?.dvr || {}).map(k => k.replace(/-\d+_.*$/, '')));

// merge recordings index with the real-time live list
function build() {
  const now = Date.now() / 1000;
  const STUB = 64 * 1024; // empty .flv files nginx creates on (re)connect
  let list = RAW.map(r => ({ ...r }));
  const growing = list.filter(r => r.status === 'recording');

  // one live entry per stream: pick the file that best matches the real session
  // /stat only reports one nginx worker's streams (multi-worker + rtmp_auto_push), so a
  // publishing camera can be missing from it; trust a growing recording entry as live too.
  const liveNames = [...new Set([...(LIVE ? [...LIVE.keys()] : []), ...growing.map(r => r.stream), ...dvrStreams()])];
  const keep = new Set();
  for (const name of liveNames) {
    const cands = growing.filter(r => r.stream === name);
    // the live file is the newest one still being written: with record_interval a session
    // is split into several files, and after a reconnect the old file stops growing.
    // (/stat's stream time isn't used: it follows the camera's own clock, which can reset.)
    let best = cands.filter(r => (r.size || 0) >= STUB).sort((a, b) => b.start - a.start)[0] || null;
    const statStart = LIVE?.get(name) ? now - LIVE.get(name).ms / 1000 : null;
    if (!best) list.push(best = { file: 'live:' + name, stream: name, size: 0, status: 'recording', start: Math.round(statStart ?? now) });
    keep.add(best);
  }
  list = list.filter(r => {
    if (r.status !== 'recording' || keep.has(r)) return true;
    if ((r.size || 0) < STUB) return false;   // hide empty stub files
    r.status = 'processing';                   // earlier session, waiting for conversion
    return true;
  });
  for (const r of list) if (r.status === 'recording' || r.status === 'processing') {
    if (r.status === 'recording') r.duration = now - r.start;
    r.dvr = DVR?.dvr?.[r.file] || null; // seekable HLS copy of the file so far
    if (r.dvr?.thumb) { r.thumb = r.dvr.thumb; r.thumbV = r.dvr.thumbAt; } // refreshed every minute
    // (motion is found by recordings.py once the recording is finished)
  }
  // who was seen in which motion event, and when: {event: {person id: offset}}, and from when
  // to when they were in view: {event: {person id: [from, to]}} (offsets; older recordings
  // have no range, just the moment of the snapshot)
  for (const r of list) {
    r.who = {}; r.inView = {};
    for (const [ev, t, pid, , t0, t1] of PEOPLE?.seen?.[r.file] || []) {
      (r.who[ev] ||= {})[pid] ??= t;
      if (t0 == null) continue;
      const v = (r.inView[ev] ||= {})[pid];
      r.inView[ev][pid] = v ? [Math.min(v[0], t0), Math.max(v[1], t1)] : [t0, t1];
    }

  ALL.forEach(r => streamColor(r.stream));
}

async function load() {
  try {
    let recs;
    try {
      const r = await fetch(`${CFG.streams}?t=${Date.now()}`, { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      STREAMS = (await r.json()).streams || [];
      recs = (await perStream('index.json')).filter(Boolean).flatMap(t => JSON.parse(t).recordings || []);
      source = 'index';
    } catch {
      const r = await fetch(CFG.fallback, { cache: 'no-store' });
      if (!r.ok) throw new Error(`Could not load recordings (HTTP ${r.status})`);
      const now = Date.now() / 1000;
      recs = (await r.json())
        .filter(f => f.type === 'file' && /\.(mp4|flv)$/i.test(f.name))
        .map(f => {
          const p = parseName(f.name), mt = Date.parse(f.mtime) / 1000;
          const mp4 = /\.mp4$/i.test(f.name);
          const start = p.start ?? mt;
          return { file: f.name, stream: p.stream, start, duration: Math.max(0, mt - start), size: f.size,
                   status: mp4 ? 'ready' : (now - mt < 90 ? 'recording' : 'flv') };
        });
      source = 'fallback';
    }
    RAW = recs;
    await Promise.all([fetchStat(), fetchLiveDvr(), fetchPeople()]);
    build();
    render();
    if (!loadedOnce) { loadedOnce = true; openFromHash(); }
  } catch (e) {
    if (!loadedOnce) $('#home').innerHTML = `<div class="empty"><b>Couldn't load recordings</b>${esc(e.message)}<br>Check that <code>/recordings/streams.json</code> or <code>/api/files/</code> is reachable.</div>`;
  }
}

$('#vFull').onclick = () => { document.fullscreenElement ? document.exitFullscreen() : $('#vwrap').requestFullscreen?.(); };
$('#vSpeed').onclick = () => { const b = [...$('#speeds').children], i = b.findIndex(x => x.classList.contains('on')); b[(i + 1) % b.length].click(); syncVctl(); };

// the calendar button: a month of days; the ones with recordings open that day
const calView = { y: 0, m: 0 };
function calRender() {
  const cur = ALL.find(x => x.file === currentFile); if (!cur) return;
  const have = new Set(ALL.filter(r => r.stream === cur.stream).map(r => r.day));
  const first = new Date(calView.y, calView.m, 1), lead = (first.getDay() + 6) % 7;
  const n = new Date(calView.y, calView.m + 1, 0).getDate(), today = dayKey(new Date());
  const days = [...have].sort(), mk = k => k.slice(0, 7);
  const ym = `${calView.y}-${pad(calView.m + 1)}`;
  let cells = '<i></i>'.repeat(lead);
  for (let d = 1; d <= n; d++) {
    const k = `${ym}-${pad(d)}`;
    cells += `<button data-d="${k}" class="${k === cur.day ? 'sel' : ''}${k === today ? ' tod' : ''}"${have.has(k) ? '' : ' disabled'}>${d}</button>`;
  }
  $('#calPop').innerHTML = `<div class="calhead"><button data-m="-1" aria-label="Previous month"${days[0] && mk(days[0]) >= ym ? ' disabled' : ''}>‹</button><b>${first.toLocaleDateString([], { month: 'long', year: 'numeric' })}</b><button data-m="1" aria-label="Next month"${days.length && mk(days[days.length - 1]) <= ym ? ' disabled' : ''}>›</button></div>`
    + `<div class="calgrid">${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(x => `<span>${x}</span>`).join('')}${cells}</div>`;
}
function calToggle(open = $('#calPop').hidden) {
  const cur = ALL.find(x => x.file === currentFile);
  if (open && cur) { const d = fromKey(cur.day); calView.y = d.getFullYear(); calView.m = d.getMonth(); calRender(); }
  $('#calPop').hidden = !open; $('#pCal').setAttribute('aria-expanded', open);
}
$('#pCal').onclick = e => { e.stopPropagation(); calToggle(); };
$('#calPop').onclick = e => {
  e.stopPropagation();
  const mb = e.target.closest('button[data-m]'), db = e.target.closest('button[data-d]');
  if (mb && !mb.disabled) { calView.m += +mb.dataset.m; if (calView.m < 0) { calView.m = 11; calView.y--; } if (calView.m > 11) { calView.m = 0; calView.y++; } calRender(); }
  if (db && !db.disabled) {
    const cur = ALL.find(x => x.file === currentFile), day = db.dataset.d;
    calToggle(false);
    if (cur && day !== cur.day) {
      const recs = visible.filter(r => r.stream === cur.stream && r.day === day).sort((a, b) => a.start - b.start);
      if (recs.length) openPlayer(recs[0]._i, unfinished(recs[0]) ? null : 0);
    }
  }
};
document.addEventListener('click', () => { if (!$('#calPop').hidden) calToggle(false); });

// the buttons and badges on the picture fade out after a few seconds of playing; a touch or
// mouse move (or pausing) brings them back
(() => {
  let t = 0, px = -1, py = -1;
  const arm = () => { clearTimeout(t); if (!curVid().paused) t = setTimeout(() => vwrap.classList.add('idle'), 3000); };
  const wake = () => { vwrap.classList.remove('idle'); arm(); };
  // only real input wakes it (the browser also fires mouse moves when things fade under a still pointer)
  vwrap.addEventListener('pointermove', e => {
    if (Math.abs(e.clientX - px) + Math.abs(e.clientY - py) < 6) return;
    if (px >= 0) wake();
    px = e.clientX; py = e.clientY;
  }, { passive: true });
  for (const e of ['pointerdown', 'keydown']) vwrap.addEventListener(e, wake, { passive: true });
  for (const v of [video, hdVideo]) {
    v.addEventListener('pause', wake);
    for (const e of ['play', 'playing']) v.addEventListener(e, () => { if (!vwrap.classList.contains('idle')) arm(); });
  }
  document.addEventListener('keydown', e => { if (modal.classList.contains('open') && e.key !== 'Escape') wake(); });
  arm();
})();

/* ===== events ===== */
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2200);
}

const isMobile = () => matchMedia('(max-width:640px)').matches;
// the mobile timeline is sized in px, so redraw it when the width changes (rotation, breakpoint)
let rzT, rzW = innerWidth;
addEventListener('resize', () => {
  clearTimeout(rzT);
  rzT = setTimeout(() => {
    if (modal.classList.contains('open')) renderScrub();
  }, 150);
});
$('#pClose').onclick = () => closePlayer();
modal.addEventListener('click', e => { if (e.target === modal) closePlayer(); });
// swipe down on the video area to close (mobile)
(() => { let y0 = null; const st = $('.stage');
  st.addEventListener('touchstart', e => { y0 = e.touches.length === 1 && !e.target.closest('.scrub') && zoom.z === 1 ? e.touches[0].clientY : null; }, { passive: true });
  st.addEventListener('touchend', e => { if (y0 !== null && e.changedTouches[0].clientY - y0 > 110 && !document.fullscreenElement) closePlayer(); y0 = null; }, { passive: true });
})();
$('#pCopy').onclick = async () => {
  const r = ALL.find(x => x.file === currentFile); if (!r) return;
  const url = location.origin + location.pathname + hashFor(r);
  try { await navigator.clipboard.writeText(url); toast('Link copied'); }
  catch { prompt('Copy this link:', url); }
};

document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement?.tagName);
  if (!modal.classList.contains('open')) return;
  if (typing) return;
  const k = e.key.toLowerCase();
  if (k === 'escape') closePlayer();
  else if (k === 'n') step(1);
  else if (k === 'p') step(-1);
  else if (k === ']') dayStep(1);
  else if (k === '[') dayStep(-1);
  else if (k === 'm') jumpMotion(e.shiftKey ? -1 : 1);
  else if (k === '+' || k === '=') setZoom(scrub.z * 2);
  else if (k === '-' || k === '_') setZoom(scrub.z / 2);
  else if (k === 'f' && !video.hidden) { document.fullscreenElement ? document.exitFullscreen() : $('#vwrap').requestFullscreen?.(); } // the badge too
  else if (document.activeElement !== video && document.activeElement !== hdVideo && !video.hidden) {
    const v = hd.on ? hdVideo : video;  // whichever is showing
    if (k === ' ') { e.preventDefault(); v.paused ? v.play() : v.pause(); }
    else if (k === 'arrowright') { hd.on ? seekAbs(playheadTime() + 10) : v.currentTime += 10; }
    else if (k === 'arrowleft') { hd.on ? seekAbs(playheadTime() - 10) : v.currentTime -= 10; }
  }
});

load();
setInterval(() => { if (!document.hidden) load(); }, CFG.refreshMs);
// real-time live status
setInterval(async () => {
  if (document.hidden || !loadedOnce) return;
  const sig = () => JSON.stringify([...new Set([...(LIVE ? [...LIVE.keys()] : []), ...dvrStreams()])].sort());
  const before = sig();
  await fetchStat();
  build();
  if (before !== sig()) render();
  else if (currentFile) refreshPlayerMeta();
}, CFG.statMs);
// rewindable copies of the recordings in progress
setInterval(async () => {
  if (document.hidden || !loadedOnce) return;
  if (!(await fetchLiveDvr())) return;
  build(); render();
  if (currentFile) refreshPlayerMeta();
}, CFG.liveDvrMs);
// tick the "live for" counter in the player
setInterval(() => {
  const r = currentFile && ALL.find(x => x.file === currentFile);
  if (r && r.status === 'recording') { r.dur = Date.now() / 1000 - r.start; refreshPlayerMeta(); }
}, 1000);
</script>

  appId: '1:626888021222:web:89911e33e91338b2bf9727',
});
const auth = getAuth(app), $ = id => document.getElementById(id);
const login = $('login'), card = $('loginCard'), err = $('loginErr'), acct = $('acct');
onAuthStateChanged(auth, user => {
  login.hidden = !!user;

    acct.title = user.email || 'Account';

    window.dispatchEvent(new Event('resize'));  // the page drew itself behind the sign-in screen
  }
}, () => { card.hidden = false; err.textContent = 'Could not check the sign-in. Reload to try again.'; });
$('gSignIn').onclick = async () => {
  err.textContent = ''; $('gSignIn').disabled = true;
  const p = new GoogleAuthProvider();
  try { await signInWithPopup(auth, p); }
  catch (e) {
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') { try { await signInWithRedirect(auth, p); return; } catch (e2) { e = e2; } }
    if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request')
      err.textContent = e.code === 'auth/unauthorized-domain' ? 'This address isn\'t allowed for Google sign-in yet.' : 'Sign-in failed. Try again.';
  }
  $('gSignIn').disabled = false;
};
acct.onclick = () => { if (confirm(`Sign out${auth.currentUser?.email ? ' ' + auth.currentUser.email : ''}?`)) signOut(auth); };
</script>
