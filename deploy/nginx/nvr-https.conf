map $http_upgrade $conn_up { default upgrade; "" close; }
server {
    listen 443 ssl;
    server_name guttedar.duckdns.org;
    ssl_certificate     /etc/letsencrypt/live/guttedar.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guttedar.duckdns.org/privkey.pem;
    client_max_body_size 50m;

    # login check (rtmp-web/auth_gate.js): the sign-in endpoints are open, nginx asks /auth/check for the rest
    location = /auth/check {
        internal;
        proxy_pass http://127.0.0.1:3300;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }
    location /auth/ {
        proxy_pass http://127.0.0.1:3300;
        proxy_set_header Cookie $http_cookie;
    }
    # the page itself (it has the sign-in screen) and the player library are open; nothing in them is private
    location = / { include /etc/nginx/nvr-proxy.inc; }
    location /assets/ { include /etc/nginx/nvr-proxy.inc; }
    # everything else (data, recordings, live streams, people) needs the session cookie
    location / {
        auth_request /auth/check;
        include /etc/nginx/nvr-proxy.inc;
    }
}
