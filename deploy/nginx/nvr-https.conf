map $http_upgrade $conn_up { default upgrade; "" close; }
server {
    listen 443 ssl;
    server_name guttedar.duckdns.org;
    ssl_certificate     /etc/letsencrypt/live/guttedar.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guttedar.duckdns.org/privkey.pem;
    client_max_body_size 50m;
    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $conn_up;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
