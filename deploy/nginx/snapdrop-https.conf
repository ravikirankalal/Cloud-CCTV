server {
    listen 8443 ssl;
    server_name guttedar.duckdns.org;
    ssl_certificate     /etc/letsencrypt/live/guttedar.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guttedar.duckdns.org/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $conn_up;
        proxy_read_timeout 3600s;
    }
}
