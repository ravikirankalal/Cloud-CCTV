# /etc/nginx/conf.d/nvr.conf (from nvr/deploy/nginx-site.conf): the NVR site (page, recordings, live, API) behind Google sign-in.
map $http_upgrade $conn_up { default upgrade; "" close; }

server {
    listen 443 ssl;
    server_name guttedar.duckdns.org;
    ssl_certificate     /etc/letsencrypt/live/guttedar.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guttedar.duckdns.org/privkey.pem;
    root /home/ubuntu/nvr/web;

    # sign-in (signin.js): nginx asks /auth/check before anything private
    location = /auth/check {
        internal;
        proxy_pass http://127.0.0.1:3300;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }
    location /auth/ {
        proxy_pass http://127.0.0.1:3300;
        proxy_set_header Cookie $http_cookie;
    }

    # the page and its script (public: the page itself shows the sign-in)
    location = / { try_files /index.html =404; add_header Cache-Control "no-cache"; }
    location = /people { try_files /people.html =404; add_header Cache-Control "no-cache"; }
    location = /jobs { try_files /jobs.html =404; add_header Cache-Control "no-cache"; }
    location /assets/ { add_header Cache-Control "public, max-age=604800"; }

    # recorded segments and init files only (never the database or anything else in the data folder)
    location ~ "^/media/([a-z0-9]+/(?:init/init-\d+\.mp4|\d{4}-\d\d-\d\d/\d\d/seg-\d+\.m4s))$" {
        auth_request /auth/check;
        alias /home/ubuntu/nvr-data/$1;
        types { video/iso.segment m4s; video/mp4 mp4; }
        add_header Cache-Control "private, max-age=86400";
    }

    # zero-delay live: camera_stream.js relays frames over a WebSocket on a Unix socket
    location = /api/live-ws/cam1 {
        auth_request /auth/check;
        proxy_pass http://unix:/home/ubuntu/nvr/run/hd-live-cam1.sock:/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $conn_up;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # playlists, coverage, exports (playback_api.py)
    location /api/ {
        auth_request /auth/check;
        proxy_pass http://127.0.0.1:3400;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # people / detection feedback API (detect_api.py; decoupled, own service)
    location /detapi/ {
        auth_request /auth/check;
        proxy_pass http://127.0.0.1:3401;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / { return 404; }
}
