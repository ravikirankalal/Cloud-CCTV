<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b0f">
<title>People · Guttedar Nilaya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080b0f; --bg2:#0c1117;
  --panel:#111720; --panel2:#171e28; --elev:#212b37;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.14);
  --text:#eef3f8; --muted:#97a3b1; --faint:#5f6b78;
  --rec:#3f8cff; --ok:#2fd27a; --warn:#f5a524; --live:#ff3b4e;
  --radius:16px; --radius-sm:11px;
  --lift:0 1px 0 rgba(255,255,255,.045) inset;
  --shadow:0 18px 48px -28px rgba(0,0,0,.9);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;
  background:radial-gradient(120% 56% at 50% -8%,rgba(63,140,255,.07),transparent 60%),
    radial-gradient(140% 80% at 50% -4%,#141c27 0%,var(--bg) 54%);background-attachment:fixed}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;font-weight:500;color:var(--text);background:var(--panel2);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:0 15px;min-height:44px;cursor:pointer;touch-action:manipulation;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;box-shadow:var(--lift);
  transition:background .16s,border-color .16s,color .16s,transform .05s}
button:hover{background:var(--elev);border-color:var(--line2)}
button:active{transform:scale(.975)}
button:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--rec)}
[hidden]{display:none!important}
a{color:var(--rec);text-decoration:none}
.app{max-width:1060px;margin:0 auto;padding:18px 16px calc(28px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px;padding:0 2px}
header h1{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:0;flex:1}
.back{width:44px;padding:0;font-size:18px;color:var(--muted)}
.ghost{background:var(--panel2);color:var(--muted);font-size:13px;min-height:38px}
h2{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);
  margin:26px 2px 12px;display:flex;align-items:center;gap:9px}
h2 .n{color:var(--faint);font-weight:500}
h2:first-of-type{margin-top:6px}
/* grids */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
.crops{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;
  box-shadow:var(--lift);text-align:left;padding:0;flex-direction:column;align-items:stretch;min-height:0}
.card .ph{aspect-ratio:3/4;background:var(--bg2) center/cover;display:block;width:100%;object-fit:cover}
.card .meta{padding:8px 10px}
.card .nm{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ct{font-size:11.5px;color:var(--muted)}
.thumb{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;border:1px solid var(--line);
  background:var(--bg2);padding:0;box-shadow:var(--lift)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .sc{position:absolute;left:5px;bottom:5px;background:rgba(8,11,15,.72);backdrop-filter:blur(6px);
  font-size:10.5px;padding:2px 6px;border-radius:6px;color:var(--muted);font-variant-numeric:tabular-nums}
.thumb .cnt{position:absolute;right:5px;top:5px;display:inline-flex;align-items:center;gap:3px;
  background:var(--rec);color:#00122b;font-weight:700;font-size:11px;padding:2px 7px;border-radius:999px;
  box-shadow:0 2px 8px rgba(0,0,0,.45);font-variant-numeric:tabular-nums}
.thumb .cnt::before{content:"";width:5px;height:5px;border-radius:50%;background:#00122b;opacity:.55}
.thumb.sel{outline:3px solid var(--rec);outline-offset:-3px}
.thumb .chk{position:absolute;left:5px;top:5px;width:22px;height:22px;border-radius:50%;background:rgba(8,11,15,.55);
  border:1.5px solid rgba(255,255,255,.7);color:#00122b;align-items:center;justify-content:center;font-size:13px;
  font-weight:800;display:none}
body.selecting .thumb .chk{display:inline-flex}
.thumb.sel .chk{background:var(--rec);border-color:var(--rec)}
.actionbar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);
  display:flex;gap:8px;align-items:center;background:var(--elev);border:1px solid var(--line2);border-radius:999px;
  padding:8px 10px 8px 16px;box-shadow:var(--shadow);z-index:15;max-width:calc(100vw - 24px)}
.actionbar .ct{font-size:13px;font-weight:600;white-space:nowrap;margin-right:2px}
.actionbar button{min-height:40px;padding:0 13px}
.actionbar .tag{background:var(--rec);border-color:transparent;color:#001;font-weight:700}
.actionbar .rej{color:var(--warn);background:var(--panel2)}
.actionbar .cancel{color:var(--muted);background:transparent;border-color:transparent}
.actionbar button:disabled{opacity:.4;pointer-events:none}
.psheet .crops{max-height:48vh;overflow:auto;margin:12px 0 4px;clear:both}
.psheet .thumb .chk{display:none}
.psheet .thumb.sel{outline-color:var(--warn)}
.psheet .thumb.sel .chk{display:inline-flex;background:var(--warn);border-color:var(--warn)}
.datebar{display:flex;align-items:center;gap:8px;margin:2px 2px 18px}
.datebar .icon{width:40px;min-height:40px;padding:0;font-size:18px;line-height:1}
.datebar .dlabel{flex:1;text-align:center;font-weight:600;font-size:13.5px;cursor:pointer;user-select:none;
  font-variant-numeric:tabular-nums;letter-spacing:.2px}
.datebar .ghost{font-size:12.5px}
.datebar .ghost.on{color:var(--rec);border-color:var(--rec)}
.datebar button:disabled{opacity:.38;pointer-events:none}
.empty{color:var(--faint);font-size:14px;padding:18px 2px}
.note{color:var(--muted);font-size:13px;padding:14px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-sm)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(4,6,9,.62);backdrop-filter:blur(3px);z-index:10;
  display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);border:1px solid var(--line2);border-bottom:0;
  border-radius:var(--radius) var(--radius) 0 0;width:100%;max-width:560px;padding:16px 16px calc(18px + env(safe-area-inset-bottom));
  box-shadow:var(--shadow);animation:up .2s ease}
@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}
.sheet .big{width:132px;aspect-ratio:3/4;object-fit:cover;border-radius:12px;border:1px solid var(--line);float:left;margin:0 14px 10px 0;background:var(--bg2)}
.sheet h3{margin:2px 0 2px;font-size:16px}
.sheet .sub{color:var(--muted);font-size:12.5px;margin-bottom:12px}
.sheet .meta-line{font-size:12px;color:var(--rec);margin:0 0 10px;letter-spacing:.2px;line-height:1.45}
.field{display:flex;gap:8px;margin:10px 0 4px;clear:both}
.field input{flex:1;min-height:46px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius-sm);
  color:var(--text);font:inherit;padding:0 14px}
.field input:focus{outline:none;border-color:var(--rec)}
.field button{min-width:88px;background:var(--rec);border-color:transparent;color:#001;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{min-height:38px;font-size:13px;padding:0 13px;background:var(--panel2)}
.row{display:flex;gap:8px;margin-top:12px}
.row .reject{flex:1;color:var(--warn);background:var(--panel2)}
.row .cancel{flex:1;color:var(--muted);background:transparent;border-color:transparent}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--elev);border:1px solid var(--line2);border-radius:999px;padding:10px 18px;font-size:13px;
  box-shadow:var(--shadow);z-index:20;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-2px)}
.toast.bad{border-color:rgba(255,59,78,.5)}
.spin{width:26px;height:26px;border:2.5px solid rgba(255,255,255,.16);border-top-color:#fff;border-radius:50%;
  animation:s 1s linear infinite;margin:30px auto}
@keyframes s{to{transform:rotate(1turn)}}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="back" onclick="location.href='/'" aria-label="Back to live view">‹</button>
    <h1>People</h1>
    <button class="ghost" id="refresh">Refresh</button>
  </header>

  <div id="auth" class="note" hidden>You're not signed in. Open the <a href="/">live view</a> to sign in, then come back.</div>
  <div id="loading" class="spin"></div>
  <main id="main" hidden>
    <div class="datebar">
      <button class="icon" id="pPrev" aria-label="Previous day">‹</button>
      <div class="dlabel" id="dLabel" role="button" tabindex="0" title="Pick a date">Today</div>
      <button class="icon" id="pNext" aria-label="Next day">›</button>
      <button class="icon" id="pCal" aria-label="Pick a date">📅</button>
      <button class="ghost" id="pAll">All days</button>
      <input type="date" id="pDate" aria-hidden="true" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0">
    </div>
    <h2>People <span class="n" id="pn"></span></h2>
    <div class="people" id="people"></div>
    <div class="empty" id="people-empty" hidden>No one tagged yet — name someone below and they'll appear here.</div>

    <h2>Unknown <span class="n" id="un"></span><button class="ghost" id="selbtn" style="margin-left:auto" hidden>Select</button></h2>
    <div class="crops" id="unknowns"></div>
    <div class="empty" id="unknowns-empty" hidden>No un-identified detections right now.</div>
  </main>
</div>

<div id="sheet-host"></div>
<div id="actionbar" class="actionbar" hidden>
  <span class="ct" id="selct">0 selected</span>
  <button class="tag" id="ab-tag">Tag</button>
  <button class="rej" id="ab-rej">Not a person</button>
  <button class="cancel" id="ab-cancel">Cancel</button>
</div>
<div id="toast" class="toast"></div>

<script>
const $ = id => document.getElementById(id);
const api = {
  async get(p){ const r = await fetch(p, {cache:'no-store'}); if(r.status===401||r.status===403) throw 'auth'; if(!r.ok) throw new Error(await r.text()); return r.json(); },
  async post(p,b){ const r = await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}); if(r.status===401||r.status===403) throw 'auth'; if(!r.ok) throw new Error(await r.text()); return r.json(); }
};
let PEOPLE = [];

function toast(msg, bad){ const t=$('toast'); t.textContent=msg; t.className='toast show'+(bad?' bad':''); clearTimeout(t._t); t._t=setTimeout(()=>t.className='toast',2200); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cropUrl = id => `/detapi/crop/${id}.jpg`;
const hideBroken = img => { img.onerror = () => { const t=img.closest('.thumb,.card'); if(t) t.remove(); }; };
// all times are rendered in the viewer's own timezone
const _dt = ts => new Date(ts*1000);
const clk = ts => _dt(ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
function tileWhen(ts){                                    // compact label for a thumbnail
  const d=_dt(ts), now=new Date();
  if (d.toDateString()===now.toDateString()) return clk(ts);
  return d.toLocaleDateString([], {day:'2-digit', month:'short'}) + ' ' + clk(ts);
}
const fullWhen = ts => _dt(ts).toLocaleString([], {weekday:'short', day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit', second:'2-digit'});
function relWhen(ts){
  const s = Date.now()/1000 - ts;
  if (s<60) return 'just now'; if (s<3600) return Math.floor(s/60)+'m ago';
  if (s<86400) return Math.floor(s/3600)+'h ago';
  const d=Math.floor(s/86400); return d<30 ? d+'d ago' : _dt(ts).toLocaleDateString([], {day:'2-digit', month:'short'});
}

// ---- date awareness: the People + Unknown lists scope to one IST day, or All ----
const TZ = 'Asia/Kolkata';
const nowS = () => Date.now()/1000;
const dayKey = t => new Date(t*1000).toLocaleDateString('en-CA', {timeZone: TZ});
const dayStart = key => Date.parse(key + 'T00:00:00+05:30')/1000;
let DAY = dayKey(nowS());    // selected day YYYY-MM-DD
let ALL = true;             // start showing everything; narrow to a day via the date controls
function dayQuery(){ if(ALL) return ''; const f = dayStart(DAY); return `?from=${f}&to=${f+86400}`; }
function renderDateBar(){
  const today = dayKey(nowS());
  $('dLabel').textContent = ALL ? 'All days'
    : (DAY===today ? 'Today' : new Date(dayStart(DAY)*1000+43200e3).toLocaleDateString('en-GB',{timeZone:TZ,weekday:'short',day:'numeric',month:'short'}));
  $('pNext').disabled = ALL || DAY >= today;
  $('pPrev').disabled = ALL;
  $('pAll').classList.toggle('on', ALL);
  $('pAll').textContent = ALL ? 'Viewing all' : 'All days';
}
function setDay(key){ if(key > dayKey(nowS())) return; DAY = key; ALL = false; renderDateBar(); load(); }

async function load(){
  $('loading').hidden = false; $('main').hidden = true; $('auth').hidden = true;
  const qs = dayQuery();
  try {
    const [people, unk] = await Promise.all([api.get('/detapi/people'+qs), api.get('/detapi/unknowns'+qs)]);
    PEOPLE = people;
    renderPeople(people); renderUnknowns(unk);
    $('loading').hidden = true; $('main').hidden = false;
  } catch (e) {
    $('loading').hidden = true;
    if (e === 'auth') $('auth').hidden = false; else toast('Could not load — '+e, true);
  }
}

function renderPeople(people){
  $('pn').textContent = people.length ? people.length : '';
  $('people-empty').hidden = people.length > 0;
  $('people-empty').textContent = ALL ? "No one tagged yet — name someone below and they'll appear here."
    : 'No known people seen on this day.';
  $('people').innerHTML = people.map(p => `
    <button class="card" onclick="openDetail({id:${p.id},person:true})">
      ${p.sample ? `<img class="ph" src="${cropUrl(p.sample)}" loading="lazy" onerror="this.style.visibility='hidden'">` : `<span class="ph"></span>`}
      <span class="meta"><span class="nm">${esc(p.name)}</span><span class="ct">${p.count} sighting${p.count===1?'':'s'}${p.last ? ` · ${relWhen(p.last)}` : ''}</span></span>
    </button>`).join('');
}

let UNK = [];            // current unknown groups
let SEL = null;          // null = not selecting; otherwise a Set of selected rep ids

function renderUnknowns(unk){
  UNK = unk;
  $('un').textContent = unk.length ? unk.length : '';
  $('unknowns-empty').hidden = unk.length > 0;
  $('unknowns-empty').textContent = ALL ? 'No un-identified detections right now.'
    : 'No un-identified detections on this day.';
  $('selbtn').hidden = unk.length === 0;
  if (SEL) for (const id of [...SEL]) if (!unk.some(d => d.id === id)) SEL.delete(id);  // drop vanished groups
  $('unknowns').innerHTML = unk.map(d => `
    <button type="button" class="thumb${SEL && SEL.has(d.id) ? ' sel' : ''}" data-id="${d.id}">
      <img src="${cropUrl(d.id)}" loading="lazy">
      <span class="chk">✓</span>
      ${d.count > 1 ? `<span class="cnt mono">${d.count}</span>` : ''}
      <span class="sc mono">${tileWhen(d.ts)}</span>
    </button>`).join('');
  $('unknowns').querySelectorAll('.thumb').forEach(btn => {
    const img = btn.querySelector('img'); if (img) hideBroken(img);
    const id = parseInt(btn.dataset.id);
    btn.addEventListener('click', () => onTile(id));
    btn.addEventListener('contextmenu', e => { e.preventDefault(); enterSelect(id); });  // long-press / right-click
  });
  refreshSel();
}

// ---- multi-select ----
function onTile(id){
  if (SEL){ SEL.has(id) ? SEL.delete(id) : SEL.add(id); refreshSel(); return; }
  const d = UNK.find(x => x.id === id);
  if (d) openDetail({ id: d.id });
}
function enterSelect(id){
  if (!SEL){ SEL = new Set(); document.body.classList.add('selecting'); }
  if (id != null) SEL.add(id);
  refreshSel();
}
function exitSelect(){ SEL = null; document.body.classList.remove('selecting'); refreshSel(); }
function refreshSel(){
  $('unknowns').querySelectorAll('.thumb').forEach(btn =>
    btn.classList.toggle('sel', !!SEL && SEL.has(parseInt(btn.dataset.id))));
  const n = SEL ? SEL.size : 0;
  $('actionbar').hidden = !SEL;
  $('selbtn').textContent = SEL ? 'Done' : 'Select';
  if (SEL){
    $('selct').textContent = `${n} selected`;
    $('ab-tag').disabled = n === 0; $('ab-rej').disabled = n === 0;
  }
}
function selTotal(ids){ return UNK.filter(d => ids.includes(d.id)).reduce((s, d) => s + d.count, 0); }

function openMultiTag(ids){
  const g = ids.length, total = selTotal(ids);
  const chips = PEOPLE.map(p => `<button type="button" class="chip" data-name="${esc(p.name)}">${esc(p.name)}</button>`).join('');
  $('sheet-host').innerHTML = `
    <div class="scrim" onclick="if(event.target===this)closeSheet()">
      <div class="sheet" role="dialog" aria-label="Name these people">
        <h3>Tag ${g} group${g === 1 ? '' : 's'}</h3>
        <div class="sub">Naming applies to all <b>${total}</b> sighting${total === 1 ? '' : 's'} across ${g} selected group${g === 1 ? '' : 's'}.</div>
        <div class="field">
          <input id="nm" placeholder="Name" autocomplete="off" enterkeyhint="done">
          <button id="mtag">Tag</button>
        </div>
        ${chips ? `<div class="chips">${chips}</div>` : ''}
        <div class="row"><button class="cancel" onclick="closeSheet()">Cancel</button></div>
      </div>
    </div>`;
  setTimeout(() => $('nm').focus(), 50);
  const go = () => assignMany(ids, $('nm').value);
  $('mtag').onclick = go;
  $('nm').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  document.querySelectorAll('.sheet .chip').forEach(c =>
    c.addEventListener('click', () => { const i = $('nm'); i.value = c.dataset.name; i.focus(); }));
}

async function assignMany(ids, name){
  name = (name || '').trim();
  if (!name){ toast('Enter a name', true); return; }
  try{ const r = await api.post('/detapi/tag', { ids, name });
    closeSheet(); exitSelect();
    toast(`Tagged ${name} · ${ids.length} group${ids.length === 1 ? '' : 's'}${r.rematched ? ` · ${r.rematched} re-matched` : ''}`);
    load();
  }catch(e){ toast(e === 'auth' ? 'Sign in first' : 'Tag failed', true); }
}
async function dismissMany(ids){
  try{ await api.post('/detapi/reject', { ids }); exitSelect();
    toast(`Dismissed ${ids.length} group${ids.length === 1 ? '' : 's'}`); load();
  }catch(e){ toast(e === 'auth' ? 'Sign in first' : 'Failed', true); }
}

let DIRTY = false;   // a sheet action changed data -> reload the lists when the sheet closes
function closeSheet(){ $('sheet-host').innerHTML=''; if(DIRTY){ DIRTY=false; load(); } }

// One detail sheet for BOTH an unknown group and a tagged person: a crop grid you can prune, plus an
// editable name. For an unknown group the name tags it; for a person it renames (merging into an existing
// same-name person). `o` = {id, person?}  (id = a group member for unknowns, the identity id for a person).
async function openDetail(o){
  const isP = !!o.person;
  const self = isP ? PEOPLE.find(x => x.id === o.id) : null;
  const curName = self ? self.name : '';
  const chips = PEOPLE.filter(p => !isP || p.id !== o.id)
    .map(p => `<button type="button" class="chip" data-name="${esc(p.name)}">${esc(p.name)}</button>`).join('');
  $('sheet-host').innerHTML = `
    <div class="scrim" onclick="if(event.target===this)closeSheet()">
      <div class="sheet psheet" role="dialog" aria-label="${isP ? esc(curName) : 'Name this group'}">
        <h3>${isP ? 'Edit person' : 'Who is this?'}</h3>
        <div class="field">
          <input id="nm" placeholder="Name" autocomplete="off" enterkeyhint="done" value="${isP ? esc(curName) : ''}">
          <button id="save">${isP ? 'Save' : 'Tag'}</button>
        </div>
        ${chips ? `<div class="chips">${chips}</div>` : ''}
        <div class="sub" id="psub"></div>
        <div class="crops" id="pcrops"><div class="spin"></div></div>
        <div class="row">
          <button class="reject" id="premove" hidden>Remove</button>
          ${isP ? '' : `<button class="reject" id="pdismiss">Not a person</button>`}
          <button class="cancel" onclick="closeSheet()">Close</button>
        </div>
      </div>
    </div>`;
  document.querySelectorAll('.sheet .chip').forEach(c =>
    c.addEventListener('click', () => { const i = $('nm'); i.value = c.dataset.name; i.focus(); }));
  if (!isP) setTimeout(() => $('nm').focus(), 50);

  let data;
  try{ data = await api.get((isP ? '/detapi/person?id=' : '/detapi/group?id=') + o.id); }
  catch(e){ $('pcrops').innerHTML = `<div class="empty">${e==='auth'?'Sign in first':'Could not load images'}</div>`; return; }
  const dets = data.detections || [];
  const RM = new Set();
  const noun = isP ? `that aren't ${esc(curName)}` : `that don't belong`;
  const base = () => dets.length ? `${dets.length} image${dets.length===1?'':'s'} · tap any ${noun} to remove` : 'No images.';
  function upd(){
    const n = RM.size;
    const btn = $('premove'); btn.hidden = n===0; btn.textContent = `Remove ${n}`;
    $('psub').innerHTML = n ? `${n} marked to remove` : base();
  }
  function draw(){
    const g = $('pcrops');
    g.innerHTML = dets.length ? dets.map(d => `
      <button type="button" class="thumb${RM.has(d.id)?' sel':''}" data-id="${d.id}">
        <img src="${cropUrl(d.id)}" loading="lazy">
        <span class="chk">✕</span>
        <span class="sc mono">${tileWhen(d.ts)}</span>
      </button>`).join('') : '<div class="empty">No images.</div>';
    g.querySelectorAll('.thumb').forEach(b => {
      const img = b.querySelector('img'); if(img) hideBroken(img);
      b.addEventListener('click', () => {
        const id = parseInt(b.dataset.id);
        RM.has(id) ? RM.delete(id) : RM.add(id);
        b.classList.toggle('sel'); upd();
      });
    });
  }
  draw(); upd();

  $('save').onclick = async () => {
    const name = $('nm').value.trim();
    if(!name){ toast('Enter a name', true); return; }
    try{
      if (isP){ await api.post('/detapi/rename', {id:o.id, name}); toast(`Saved ${name}`); }
      else { const r = await api.post('/detapi/tag', {id:o.id, name}); toast(`Tagged ${name}${r.rematched?` · ${r.rematched} re-matched`:''}`); }
      DIRTY = true; closeSheet();
    }catch(e){ toast(e==='auth'?'Sign in first':'Save failed', true); }
  };
  $('nm').addEventListener('keydown', e => { if(e.key==='Enter') $('save').click(); });

  $('premove').onclick = async () => {
    const ids = [...RM]; if(!ids.length) return;
    try{ await api.post('/detapi/unassign', {ids});
      for(const id of ids){ const i = dets.findIndex(d => d.id===id); if(i>=0) dets.splice(i,1); }
      RM.clear(); draw(); upd(); DIRTY = true;       // keep the sheet open so you can still tag the rest
      toast(`Removed ${ids.length}`);
    }catch(e){ toast(e==='auth'?'Sign in first':'Remove failed', true); }
  };

  if (!isP) $('pdismiss').onclick = async () => {
    try{ await api.post('/detapi/reject', {id:o.id}); DIRTY = true; closeSheet(); toast('Dismissed'); }
    catch(e){ toast(e==='auth'?'Sign in first':'Failed', true); }
  };
}

$('refresh').onclick = load;
$('selbtn').onclick = () => SEL ? exitSelect() : enterSelect();
$('ab-cancel').onclick = exitSelect;
$('ab-tag').onclick = () => { if (SEL && SEL.size) openMultiTag([...SEL]); };
$('ab-rej').onclick = () => { if (SEL && SEL.size) dismissMany([...SEL]); };
// date navigation
$('pPrev').onclick = () => setDay(dayKey(dayStart(DAY) - 43200));
$('pNext').onclick = () => setDay(dayKey(dayStart(DAY) + 129600));
const openDatePick = () => { const d = $('pDate'); d.value = ALL ? dayKey(nowS()) : DAY; d.max = dayKey(nowS()); d.showPicker ? d.showPicker() : d.focus(); };
$('pCal').onclick = openDatePick;
$('pDate').onchange = e => { if (e.target.value) setDay(e.target.value); };
$('pAll').onclick = () => { ALL = !ALL; renderDateBar(); load(); };
$('dLabel').onclick = openDatePick;
$('dLabel').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDatePick(); } };
renderDateBar();
load();
</script>
</body>
</html>
